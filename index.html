<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculators">
  <title>Tim's Calculators</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">TIM'S TOOLBOX</p>
      <h1>Calculators</h1>
      <p>Fast answers without the clutter.</p>
    </header>

    <section id="homeView">
      <h2>Favorites</h2>
      <div class="grid">
        <button class="tile disabled"><span>🏗️</span><b>Construction Master</b><small>Coming soon</small></button>
        <button class="tile" data-open="percentages"><span>%</span><b>Percentages</b><small>Ready</small></button>
        <button class="tile disabled"><span>🏖️</span><b>Days Until</b><small>Coming soon</small></button>
        <button class="tile disabled"><span>🏠</span><b>Mortgage</b><small>Coming soon</small></button>
      </div>

      <h2>All Calculators</h2>
      <div class="grid">
        <button class="tile disabled"><span>🚗</span><b>Auto Loan</b><small>Coming soon</small></button>
        <button class="tile disabled"><span>👴</span><b>Social Security</b><small>Coming soon</small></button>
        <button class="tile disabled"><span>📦</span><b>Volume</b><small>Coming soon</small></button>
      </div>
    </section>

    <section id="percentagesView" class="view hidden">
      <button class="back" data-home>← All Calculators</button>
      <h2>Percentage Calculator</h2>
      <p class="sub">Choose the question you're trying to answer.</p>

      <div class="calc-card">
        <label for="percentMode">Calculate</label>
        <select id="percentMode">
          <option value="of">What is X% of Y?</option>
          <option value="whatPercent">X is what percent of Y?</option>
          <option value="change">Percentage change from X to Y</option>
          <option value="add">Add X% to Y</option>
          <option value="subtract">Subtract X% from Y</option>
        </select>

        <div class="fields">
          <label><span id="labelA">Percent</span><input id="valueA" inputmode="decimal" type="number" step="any" placeholder="18"></label>
          <label><span id="labelB">Number</span><input id="valueB" inputmode="decimal" type="number" step="any" placeholder="240"></label>
        </div>

        <button id="calculatePercent" class="primary">Calculate</button>
        <button id="clearPercent" class="secondary">Clear</button>

        <div class="answer" aria-live="polite">
          <small>ANSWER</small>
          <strong id="percentAnswer">—</strong>
          <p id="percentExplanation">Enter two numbers above.</p>
        </div>
      </div>
    </section>

    <footer>V1 • Built for quick everyday use</footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
